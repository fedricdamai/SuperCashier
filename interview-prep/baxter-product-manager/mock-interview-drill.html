<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baxter PM Drill</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14171f; --muted:#5b6475; --line:#e3e6ec;
  --accent:#1f3c88; --accent-ink:#ffffff; --soft:#eef2fb;
  --good:#1d7a4a; --good-soft:#e5f4ec; --warn:#a2560b; --warn-soft:#fbf0e3; --bad:#b42318; --bad-soft:#fde9e7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --card:#171b23; --ink:#e8ebf1; --muted:#9aa3b5; --line:#2a303c;
    --accent:#8fb0ff; --accent-ink:#0f1218; --soft:#1d2433;
    --good:#5fd39a; --good-soft:#15291f; --warn:#f2b46b; --warn-soft:#2b2115; --bad:#ff8a80; --bad-soft:#2d1716;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --card:#171b23; --ink:#e8ebf1; --muted:#9aa3b5; --line:#2a303c;
  --accent:#8fb0ff; --accent-ink:#0f1218; --soft:#1d2433;
  --good:#5fd39a; --good-soft:#15291f; --warn:#f2b46b; --warn-soft:#2b2115; --bad:#ff8a80; --bad-soft:#2d1716;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
header h1{font-size:20px;margin:0 0 2px}
header p{margin:0;color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
select,button{font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.must{background:var(--bad-soft);color:var(--bad)}
.chip.likely{background:var(--warn-soft);color:var(--warn)}
.q{font-size:21px;line-height:1.35;font-weight:650;margin:4px 0 14px}
.timer{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.time{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;min-width:80px}
.time.over{color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.reveal{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.reveal h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.reveal ul{margin:0;padding-left:20px}
.answer{background:var(--soft);border-radius:12px;padding:12px 14px}
.trap{background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:10px 14px}
.hidden{display:none}
.rate{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.rate .good{border-color:var(--good);color:var(--good)}
.rate .shaky{border-color:var(--warn);color:var(--warn)}
.stats{margin-top:14px;font-size:13px;color:var(--muted)}
.tip{margin-top:20px;font-size:13px;color:var(--muted)}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--card)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Baxter Product Manager: Mock Interview Drill</h1>
    <p>Answer out loud before you reveal. Two minutes per answer. Executives stop listening after that.</p>
  </header>

  <div class="bar">
    <select id="round" aria-label="Filter by round"><option value="">All rounds</option></select>
    <select id="level" aria-label="Filter by level">
      <option value="">All levels</option><option>Must nail</option><option>Likely</option><option>Stretch</option>
    </select>
    <select id="mode" aria-label="Order">
      <option value="shuffle">Shuffled</option><option value="order">In order</option><option value="shaky">Shaky only</option>
    </select>
    <button id="restart">Restart</button>
  </div>

  <div class="card" id="card">
    <div class="meta" id="meta"></div>
    <div class="q" id="q"></div>
    <div class="timer">
      <span class="time" id="time">2:00</span>
      <div class="progress"><i id="prog"></i></div>
      <button id="tbtn" class="primary">Start</button>
    </div>
    <div class="rate">
      <button id="show">Reveal approach</button>
      <button id="next">Next question</button>
    </div>
    <div class="reveal hidden" id="rev">
      <h3>What they're testing</h3><div id="testing"></div>
      <h3>How to approach</h3><ul id="approach"></ul>
      <h3>Model answer</h3><div class="answer" id="answer"></div>
      <h3>Trap</h3><div class="trap" id="trap"></div>
      <div class="rate">
        <button class="good" id="good">Nailed it</button>
        <button class="shaky" id="shaky">Shaky, repeat later</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <p class="tip">Keys: <kbd>Space</kbd> timer · <kbd>R</kbd> reveal · <kbd>N</kbd> next · <kbd>1</kbd> nailed · <kbd>2</kbd> shaky</p>
</div>
<script>
const QS = [{"id": "A1", "round": "A. Opening and case choice", "lens": "Hiring manager", "level": "Must nail", "q": "Why did you pick Suprane instead of C (multivitamin) or O (parenteral nutrition)?", "testing": "Portfolio judgment. Did you dodge the biggest product?", "approach": ["Show you looked at all three in one sentence each.", "Give your selection criteria: size of the problem, how much a PM can change it, strategic risk.", "Offer a 60-second view on C and O. Don't launch into it unless they say yes."], "answer": "I looked at all three. C is the market leader at 67% share and still gaining. Its job is defending against copies without starting a price war. O is flat at 36%, held back by central-only access and fish-oil familiarity. Suprane lost 40% in one year. That's where a product manager changes the outcome the most, and it's the hardest of the three. I'd rather show you how I think on the burning platform. I have a short view on C and O if that's useful.", "trap": "Saying 'because it's interesting' or sounding like you avoided C because it's big."}, {"id": "A2", "round": "A. Opening and case choice", "lens": "Any", "level": "Must nail", "q": "Give me your whole plan in 60 seconds.", "testing": "Can you compress? Executives think in one-liners.", "approach": ["Problem, diagnosis, where to play, 3 moves, money, target, the ask.", "Use numbers. No adjectives.", "Practise until it's under 60 seconds with a timer."], "answer": "Suprane fell 40% in 2025, from 1.5 to 0.9 million. The market fell 35% and we lost share on top. Two causes: hospitals without vaporizers can't use it, and sustainability concerns are growing. So three moves. Protect the 0.9 million base with an honest green-anesthesia program. Accelerate use in vaporizer-ready, high-volume accounts by focusing on long, obese and elderly cases where fast emergence matters. Unlock six Jakarta hospitals with a vaporizer access program, with a go/no-go in Q3. Fifty thousand dollars. Calendar 2026 at about 1.3 million, exiting the year at a 1.5 million run-rate.", "trap": "Narrating slides in order instead of telling the story."}, {"id": "A3", "round": "A. Opening and case choice", "lens": "Regional marketing", "level": "Must nail", "q": "What is the single biggest reason Suprane declined in 2025?", "testing": "Root-cause discipline. Do you separate market effect from brand effect?", "approach": ["Split it: market fell 35%, Suprane fell 40%. Most of the drop is the market.", "Name your top hypothesis for the 5-point underperformance: access.", "Admit the data is outside-in and say how you'd validate. Then ask what they saw."], "answer": "Most of it is the market. The implied market fell 35%, Suprane fell 40%, so about seven-eighths of our drop is the category, and the rest is us. A 35% drop in a procedure-driven category is unusual, because surgeries didn't fall 35%. So before I'd trust it I'd check sell-in versus sell-out, tender timing, distributor stock, and supply. Baxter reported inhaled-anesthesia declines and supply constraints this year, so part of this may be supply, not demand. If it's supply, the fix is S&OP, not marketing. I'm curious what you saw internally.", "trap": "Picking one cause with total confidence when your data says 'based on assumption'."}, {"id": "B1", "round": "B. Numbers stress test", "lens": "Finance / commercial head", "level": "Must nail", "q": "Walk me through how $1.5M and 35% share fit together.", "testing": "Internal consistency. Do you know your own math?", "approach": ["Own it before they finish the question.", "1.5 / 0.35 = 4.29M market, a 19% recovery. Flat market means 42% share.", "Commit to revenue, show share as an output, give bear/base/bull."], "answer": "Good catch, and I'd tighten it. 1.5 million at 35% implies a 4.3 million market, which is a 19% recovery back toward the 2023-24 average. If the market stays flat at 3.6, 1.5 million means 42% share, which I wouldn't promise. So the number I commit to is revenue. Phased by launch dates, calendar 2026 lands around 1.3 million, and we exit Q4 at a 1.5 million-plus run-rate. If the market recovers, we hit 1.5 in the calendar year.", "trap": "Defending 35% and 1.5M as if both are certain."}, {"id": "B2", "round": "B. Numbers stress test", "lens": "Finance", "level": "Likely", "q": "Your budget note says $45k, but the line items add to $50k. Which is it?", "testing": "Attention to detail. How you handle a visible mistake.", "approach": ["One sentence. Own it. Move on.", "Don't over-apologise or explain at length."], "answer": "Fifty thousand. The 45 was an earlier draft and I missed it. Fifty is about 3.3% of the 2026 revenue target.", "trap": "Rambling, or blaming time pressure."}, {"id": "B3", "round": "B. Numbers stress test", "lens": "Finance", "level": "Likely", "q": "Slide 2 says $B and slide 5 says $M. And the case says $B. Explain.", "testing": "Do you sense-check scale?", "approach": ["Say you made a deliberate assumption.", "Give the reason in one line.", "Ratios and the plan don't change."], "answer": "The brief writes billions. For one inhaled agent in Indonesia, millions is the realistic scale, so I modelled in millions and should have footnoted it on slide 2. Shares, growth rates and ROI are the same either way.", "trap": "Not knowing the inconsistency exists."}, {"id": "B4", "round": "B. Numbers stress test", "lens": "Commercial head", "level": "Must nail", "q": "How exactly do you get $360k from six vaporizers?", "testing": "Bottom-up modelling.", "approach": ["6 x 20 bottles x 12 months x about $250.", "Then volunteer the phasing problem: installs are Q2-Q3.", "Give the in-year number."], "answer": "Six vaporizers, 20 bottles each a month, 12 months, at roughly 250 dollars a bottle. That's the annualized run-rate. Installs land in Q2 and Q3, so 2026 in-year is closer to 165 thousand. The full 360 shows up in 2027 if the Q3 usage check says go.", "trap": "Presenting 360k as 2026 revenue."}, {"id": "B5", "round": "B. Numbers stress test", "lens": "Medical / commercial", "level": "Likely", "q": "Is 20 bottles per vaporizer per month realistic?", "testing": "Clinical and operational realism.", "approach": ["Translate bottles into anesthesia hours and cases.", "Admit it implies heavy daily use.", "Show how you'd manage the risk: qualification criteria, ramp target, Q3 check."], "answer": "It's ambitious. At low flow a bottle runs roughly 12 to 14 hours, so 20 bottles is 150 to 280 hours a month, or most cases in a busy OR. So I'd only place vaporizers in ORs that can show that volume, set 12 to 15 bottles for the first three months, and use the Q3 usage check to decide whether to scale. I'd rather lower the number now than explain idle vaporizers in September.", "trap": "Defending 20 without knowing what it means in cases."}, {"id": "B6", "round": "B. Numbers stress test", "lens": "Commercial head / procurement view", "level": "Likely", "q": "What price did you assume, and what happens when same-molecule competitors undercut you?", "testing": "Pricing strategy, which the deck doesn't cover.", "approach": ["State the implied ~$250 a bottle.", "Refuse to lead with price. Reframe to cost per case and service.", "Name a walk-away principle for tenders."], "answer": "About 250 dollars a bottle, implied by my impact numbers. I won't lead with price. Procurement compares bottle prices, but the hospital pays per case. With low-flow, cost per case drops, and our vaporizer service and supply reliability are things a cheaper same-molecule brand can't easily copy. In tenders I'd set a floor with finance up front and walk away below it, rather than resetting the price for the whole market.", "trap": "Proposing price cuts to win share."}, {"id": "B7", "round": "B. Numbers stress test", "lens": "Regional marketing", "level": "Likely", "q": "Your share data says 'based on assumption'. What would you actually use?", "testing": "Data literacy in Indonesian hospital markets.", "approach": ["List real sources.", "Point to Q1 'validate data' on your roadmap."], "answer": "Distributor sell-out by account, hospital purchase data from key accounts, public tender results, a third-party hospital audit where it exists, and a vaporizer census by reps and biomedical engineering. That's the first item on my Q1 roadmap, because segmentation and targets are only as good as that census.", "trap": "Saying 'IQVIA' and nothing else."}, {"id": "C1", "round": "C. Market and segmentation", "lens": "Commercial head", "level": "Must nail", "q": "How many hospitals sit in each quadrant of your 2x2, and how much revenue?", "testing": "Can you turn a framework into a target list?", "approach": ["Admit it's not quantified.", "Explain exactly how you'd build it in 4 weeks.", "Give a hypothesis, labelled as one."], "answer": "I didn't quantify it, and it's the first thing I'd fix. In four weeks: hospital list by class and OR count, a vaporizer census through reps and biomed, and 12 months of consumption by account. Cut-offs agreed with sales, for example high volume means a set number of general-anesthesia cases a month. My hypothesis is that fewer than 30 accounts drive about 80% of revenue, which is why the plan is account-based, not broad.", "trap": "Inventing precise counts you can't support."}, {"id": "C2", "round": "C. Market and segmentation", "lens": "Medical", "level": "Likely", "q": "Why not just convert sevoflurane users? It's 66% of the market.", "testing": "Strategic focus. Do you pick fights you can win?", "approach": ["Sevo is versatile and cheaper. A head-on fight loses.", "Win where fast emergence changes outcomes: long cases, obese, elderly, day surgery.", "Small slice of a big pool is enough."], "answer": "Because sevo is a good drug and cheaper, and a head-on fight loses. I want the cases where speed of emergence actually changes something: procedures over two hours, obese patients, elderly patients, and day surgery where discharge time matters. If we win a small slice of sevo's 66% in those cases, that's enough to hit the plan.", "trap": "Trashing sevoflurane."}, {"id": "C3", "round": "C. Market and segmentation", "lens": "Any", "level": "Must nail", "q": "Who is the real decision maker for Suprane in a hospital?", "testing": "Target audience depth, a brief requirement.", "approach": ["The anesthesiologist picks the agent case by case.", "But access is gated: procurement lists it, biomed needs the vaporizer, management sets policy.", "One message per stakeholder."], "answer": "The anesthesiologist chooses per case, but three gates come first. Procurement and pharmacy decide if it's listed. Biomedical engineering decides if there's a vaporizer. Management decides if sustainability policy allows it. So I need four messages: emergence and airway safety for clinicians, PACU time and OR turnover for OR managers, cost per case for procurement, and responsible use plus throughput for management.", "trap": "Saying 'the doctor' and stopping."}, {"id": "C4", "round": "C. Market and segmentation", "lens": "Commercial head (Indonesia)", "level": "Likely", "q": "How does JKN and BPJS affect your plan?", "testing": "Indonesia market realism.", "approach": ["INA-CBG pays a bundle per case, so hospitals watch cost per case.", "Desflurane costs more per hour than sevo, so the value story is throughput and PACU time.", "Prioritise private and insured patients first; check Fornas and e-katalog status for public hospitals."], "answer": "Under JKN, hospitals get a fixed INA-CBG payment per case, so every input cost comes out of their margin. Suprane costs more per hour than sevo, so for JKN patients the argument has to be throughput: shorter PACU stays and faster OR turnover. Realistically I'd start with private hospitals and insured or self-pay patients, and I'd check Suprane's Fornas and e-katalog status before targeting public hospitals.", "trap": "Ignoring JKN entirely in an Indonesian plan."}, {"id": "C5", "round": "C. Market and segmentation", "lens": "Regional marketing", "level": "Stretch", "q": "What growth pocket is missing from your plan?", "testing": "Self-critique and creativity.", "approach": ["Name one: day surgery and ambulatory centres.", "Explain why it fits Suprane: discharge speed is money.", "Say how you'd test it cheaply."], "answer": "Day surgery. Private hospital groups are adding ambulatory capacity, and there discharge speed is revenue. Suprane's fast emergence fits exactly. I'd test it with two or three high-volume day-surgery units inside my WIN accounts before building a separate program.", "trap": "Saying 'nothing is missing'."}, {"id": "D1", "round": "D. Execution", "lens": "Commercial head", "level": "Likely", "q": "ASCEND targets +20 new users from three events. Show me the funnel.", "testing": "Whether your KPIs are built or guessed.", "approach": ["Invite, attend, follow-up, trial, adopt.", "Give numbers.", "Name the follow-up mechanism, because events alone don't convert."], "answer": "150 high-volume anesthesiologists invited across three cities, about 60% attend, so 90. Reps follow up within two weeks with a local case study and an account-level offer to support the first cases. If a quarter convert, that's about 22 new users and 15 expanding. The event isn't the program, the two-week follow-up is. I'd also run it with PERDATIN-accredited CME credit so the room is full of the right people.", "trap": "Treating an event as the conversion."}, {"id": "D2", "round": "D. Execution", "lens": "Medical", "level": "Likely", "q": "What if PROVE shows Suprane adds no real benefit in our hospitals?", "testing": "Integrity. Evidence over spin.", "approach": ["Pre-agree endpoints with medical before starting.", "Bad data is still useful: it tells you where to stop spending.", "Medical owns it, marketing doesn't design the conclusion."], "answer": "Then we've learned something cheap. Medical leads PROVE, endpoints are agreed before we start, and results get shared either way. If Suprane doesn't beat sevo in a segment, I stop promoting it there and move the money. Eight thousand dollars to avoid wasting forty is a good trade.", "trap": "Implying you'd bury bad results."}, {"id": "D3", "round": "D. Execution", "lens": "Compliance-minded leader", "level": "Must nail", "q": "Placing vaporizers in exchange for volume commitments. Isn't that a compliance risk?", "testing": "Ethics and judgment. A manager must flag this before being asked.", "approach": ["Yes, it can be. Say it plainly.", "Structure: fair-market-value lease or KSO, written contract, legal and compliance review (it's in your Q1 roadmap), no link to individual prescribers.", "Distributor and hospital-level agreements, transparent pricing."], "answer": "It can be, which is why legal and compliance review is the first step of UNLOCK in Q1. The agreement is with the hospital, not any doctor, priced at fair market value, documented, and reviewed against Baxter's code and local industry codes. Commitments are about supply planning, not rewarding prescribing. If compliance says the structure doesn't work, I'd rather go with a distributor-owned rental model than cut corners.", "trap": "Not seeing the risk at all."}, {"id": "D4", "round": "D. Execution", "lens": "Commercial head", "level": "Must nail", "q": "The sales team carries many products. Why would they spend time on Suprane?", "testing": "Leading without authority.", "approach": ["Make it easy: a short account list, not 'promote everywhere'.", "Make it worth it: incentive alignment with the sales head.", "Make it visible: monthly review, share early wins."], "answer": "Because I'll make it small, clear and worth it. Not 'push Suprane everywhere', but a list of maybe 25 accounts with a plan each. I'd agree a Suprane line in their incentive with the sales head, give them tools that save time, and show wins in the monthly review. Reps follow what's simple and what pays.", "trap": "Saying 'I'll train them better'."}, {"id": "D5", "round": "D. Execution", "lens": "Commercial head", "level": "Likely", "q": "What role does the distributor play, and how do you manage them?", "testing": "Channel thinking, thin in the deck.", "approach": ["Joint business plan with shared KPIs.", "Data: sell-out by account, monthly.", "Technical service for vaporizers and stock management."], "answer": "Three jobs: data, stock and service. A joint business plan with shared targets, monthly sell-out by account so I can see what's actually used, stock levels aligned with demand programs so we don't stock out after an event, and first-line technical service on vaporizers. I'd review it monthly, the same day as the sales review.", "trap": "Treating the distributor as a box on the roadmap."}, {"id": "D6", "round": "D. Execution", "lens": "Hiring manager", "level": "Likely", "q": "What would you stop doing?", "testing": "Prioritisation. Managers say no.", "approach": ["Name concrete things.", "Link to your 2x2."], "answer": "Broad promotion in low-potential, no-vaporizer accounts. Untargeted events. Any price cut to buy share. And any account visit without a reason tied to an account plan. That frees field time for the 25 accounts that matter.", "trap": "A vague answer like 'low-value activities'."}, {"id": "E1", "round": "E. Budget, ROI and KPIs", "lens": "Finance", "level": "Must nail", "q": "What is the ROI of your plan?", "testing": "The brief asked for ROI. The deck doesn't show it.", "approach": ["Give revenue ROI and gross-margin ROI, phased and annualized.", "State the margin assumption.", "Say what the real constraint is."], "answer": "On the slide numbers, 750 thousand of new revenue on 50 thousand is 15 times. At an assumed 60% gross margin it's about 8 times. Phased to real launch dates, it's about 390 thousand new, so roughly 3.7 times gross-margin return in year one. The constraint isn't money. It's field-force time and vaporizers.", "trap": "Quoting 18x revenue ROI as if it's profit."}, {"id": "E2", "round": "E. Budget, ROI and KPIs", "lens": "Hiring manager", "level": "Must nail", "q": "I'm cutting your budget in half. What do you keep?", "testing": "Prioritisation under pressure.", "approach": ["State the principle first.", "Protect base, fund certainty, shrink the bet.", "Give the numbers."], "answer": "Protect the base, fund the certain, shrink the bet. I keep the green stewardship program at 5 thousand because it protects 900 thousand. I keep the account accelerator at 2. I halve the vaporizer pilot to three sites at 12.5, still enough for a go/no-go. ASCEND becomes Jakarta only. PROVE shrinks to one site. That's 25 thousand.", "trap": "Cutting everything by 50% evenly."}, {"id": "E3", "round": "E. Budget, ROI and KPIs", "lens": "Commercial head", "level": "Must nail", "q": "It's June. How do I know if this is working?", "testing": "Leading vs lagging indicators. Governance.", "approach": ["Leading indicators by pillar.", "Data source and cadence.", "Pre-set decision rules."], "answer": "By June revenue will lag, so I'd watch leading indicators. Accelerate: inactive users reactivated and bottles per active user from sell-out. Protect: high-risk accounts engaged and none lost. Unlock: contracts signed, vaporizers installed, weekly bottles per vaporizer. Monthly dashboard from distributor sell-out. And a rule I'd agree with you now: if a vaporizer site is under 8 bottles a month after 3 months, we move it.", "trap": "Only naming revenue and market share."}, {"id": "E4", "round": "E. Budget, ROI and KPIs", "lens": "Finance", "level": "Likely", "q": "Your accelerator costs $2k and returns $180k. Isn't that too good to be true?", "testing": "Honesty about hidden costs.", "approach": ["Yes, the cash cost understates the real cost.", "The real cost is field-force time.", "Value the time if needed."], "answer": "The cash number flatters it. The real cost is rep time: account diagnosis, mapping users, monthly reviews. If I priced that time it'd be much more than 2 thousand. But that time is already paid for. The program redirects it from low-value calls to the accounts that matter.", "trap": "Insisting the ROI is 90x."}, {"id": "F1", "round": "F. Sustainability, risk and compliance", "lens": "Regional leadership", "level": "Must nail", "q": "The EU restricted desflurane from January 2026. Why should Baxter invest in a product the world is phasing out?", "testing": "Strategic maturity and values. The hardest question in this case.", "approach": ["Acknowledge the trend. Don't dismiss it.", "Your plan is responsible use for the right patient, not growth at any cost.", "Explain the economics and the stop rule."], "answer": "I'd take it seriously. Even the EU rule keeps desflurane for cases where it's medically needed, which is the same principle my plan uses: the right patient, low-flow, not a default agent. Indonesia has no such restriction today, and clinicians still value it for long, obese and elderly cases. Fifty thousand protects 900 thousand and funds a focused turnaround. But I've built in an exit: the sustainability mapping tells us early which hospitals are moving, and the Q3 go/no-go means if the market turns, we shift to managing it for profit, not chasing growth.", "trap": "Sounding defensive or dismissive about climate impact."}, {"id": "F2", "round": "F. Sustainability, risk and compliance", "lens": "Medical / regional", "level": "Must nail", "q": "Your low-flow program cuts bottles per case. Aren't you cutting your own revenue?", "testing": "Whether you see tensions in your own plan.", "approach": ["Yes, deliberately.", "It's the licence to operate in sustainability-minded hospitals.", "It lowers cost per case versus sevo. Growth comes from patients, not waste."], "answer": "Yes, per case, and on purpose. Low-flow is our licence to stay in hospitals that care about emissions, and it makes cost per case competitive with sevo. A hospital that bans Suprane costs me 100% of that account. A hospital that uses it well costs me some bottles per case and gives me more cases. Growth comes from more patients and more users, not more waste.", "trap": "Not having noticed the tension."}, {"id": "F3", "round": "F. Sustainability, risk and compliance", "lens": "Regional leadership", "level": "Must nail", "q": "Baxter reported supply constraints in anesthesia this year. What if we can't supply your growth?", "testing": "Awareness of company reality and cross-functional thinking.", "approach": ["Show you read the results.", "Demand programs launch only after S&OP confirms supply.", "Use the C case as the cautionary tale."], "answer": "I saw that in this year's results: supply constraints in injectables and anesthesia, with improvement by Q3. So I wouldn't launch any demand program before supply planning confirms volume. Product C shows why. The brief lists the last supply issue as one of its challenges, and a stock-out after an event burns trust that took a year to build. I'd phase ASCEND and the vaporizer installs to the supply plan, not the other way round.", "trap": "Not knowing about Baxter's supply situation."}, {"id": "F4", "round": "F. Sustainability, risk and compliance", "lens": "Hiring manager", "level": "Likely", "q": "What's the single biggest risk to your plan?", "testing": "Risk ranking, not risk listing.", "approach": ["Pick one.", "Say why it matters most.", "Give mitigation."], "answer": "Vaporizers installed but not used. It's my biggest spend and biggest revenue line. Mitigation: only qualified high-volume ORs, a signed usage commitment, training before install, a usage check at 3 months, and a pre-agreed rule to move units that underperform.", "trap": "Listing five risks with equal weight."}, {"id": "F5", "round": "F. Sustainability, risk and compliance", "lens": "Medical", "level": "Likely", "q": "Medical Affairs rejects your green anesthesia toolkit claims. What do you do?", "testing": "Working with medical and regulatory as partners.", "approach": ["Medical is a partner, not an obstacle.", "Ask what evidence they'd accept and co-own the content.", "Better a narrower true claim than a broad risky one."], "answer": "I'd ask what they would sign off and build from there. Medical should co-own that toolkit anyway, since environmental claims are easy to get wrong. A narrower claim we can defend, like 'low-flow technique reduces agent consumption', beats a broad one that comes back to hurt us.", "trap": "Escalating or working around medical."}, {"id": "F6", "round": "F. Sustainability, risk and compliance", "lens": "Regional marketing", "level": "Stretch", "q": "If Baxter Indonesia also sells sevoflurane, isn't Suprane growth partly cannibalisation?", "testing": "Portfolio thinking at account level.", "approach": ["Check the local portfolio first. Say so.", "If both are ours: 'right agent, right patient' strengthens the account.", "Measure Baxter IA share per account, not just Suprane."], "answer": "I'd confirm the local portfolio first. If both are ours, cannibalisation is the wrong frame. I'd position Baxter as the inhaled-anesthesia partner: sevo as the workhorse, Suprane for cases where fast emergence matters. Then I'd track Baxter's total inhaled share per account, because that's harder for a single-molecule competitor to take.", "trap": "Not considering the company's wider portfolio."}, {"id": "G1", "round": "G. Portfolio and Baxter strategy", "lens": "Country / regional leadership", "level": "Must nail", "q": "If you managed all three products with one budget, how would you allocate it?", "testing": "Portfolio strategy. This is the managerial-level question.", "approach": ["Give each product a role: defend, turn around, build.", "Allocate by role and by return, not by revenue alone.", "Name the link between C and O."], "answer": "Each product gets a different job. C is 76% of revenue: defend it, so it gets the largest share, spent on supply reliability, tender strategy and brand, not price. Suprane is a turnaround with a Q3 gate: fund it lean and stop if the evidence says stop. O is small but has a structural link to C, because guidelines recommend adding vitamins to parenteral nutrition. So I'd bundle O with C in nutrition-support accounts. Roughly: half to C, a quarter each to S and O, then move money at mid-year based on results.", "trap": "Allocating purely by revenue size."}, {"id": "G2", "round": "G. Portfolio and Baxter strategy", "lens": "Hiring manager", "level": "Must nail", "q": "Give me your 60-second plan for C, the multivitamin.", "testing": "Range beyond your chosen case.", "approach": ["Diagnose: market leader, share up, copies, price war, supply scar.", "Avoid the price war; win on trust and reliability.", "Use your strength: guideline-based protocols, bundling with PN."], "answer": "C is winning share in a flat market, 60 to 67%, while copies fight on price. The risk is getting dragged into a price war that destroys the category's value. I'd defend on three things copies can't match: supply reliability after last year's issue, proven efficacy and brand trust with ICU and nutrition teams, and bundling with our parenteral nutrition, since PN protocols call for daily vitamins. In tenders I'd set a walk-away floor and protect the private-hospital segment where brand matters most.", "trap": "Saying 'cut price to fight copies'."}, {"id": "G3", "round": "G. Portfolio and Baxter strategy", "lens": "Hiring manager", "level": "Likely", "q": "And your 60-second plan for O, parenteral nutrition?", "testing": "Range. Nutrition is a big part of this job.", "approach": ["Diagnose: flat 36%, central-only access, fish oil more familiar.", "Two levers: access (peripheral formulation if registered) and familiarity (education, protocols).", "Bundle with C."], "answer": "O is stuck, not falling. Two barriers: it's limited to central access, and Indonesian clinicians are more used to fish-oil lipids. First I'd check whether a peripheral formulation can be registered or promoted here, because that opens wards, not just ICUs. Second, guideline-based education with nutrition-support teams on olive-oil lipids and protein content. Third, bundle with C so every PN bag comes with a vitamin protocol.", "trap": "Claiming olive oil beats fish oil without evidence."}, {"id": "G4", "round": "G. Portfolio and Baxter strategy", "lens": "Any", "level": "Must nail", "q": "What do you know about Baxter right now?", "testing": "Preparation and commercial awareness.", "approach": ["Two or three facts from recent results.", "Link them to the role.", "Don't recite the website."], "answer": "New CEO, Andrew Hider, since August 2025, focused on operations, the balance sheet and continuous improvement. Q3 2026 sales were about 2.98 billion, up 5%. Injectables and anesthesia have been under pressure this year, with supply constraints and inhaled anesthesia down, which is part of why I took the Suprane case seriously. For this role, that means a product manager has to grow demand responsibly and in step with supply.", "trap": "Generic 'Baxter is a global healthcare leader' answers."}, {"id": "G5", "round": "G. Portfolio and Baxter strategy", "lens": "Regional leadership", "level": "Likely", "q": "What's your three-year view for Suprane?", "testing": "Long-range thinking, beyond 2026.", "approach": ["Year by year, with decision points.", "Include the possibility of managing for profit."], "answer": "2026: stabilise the base and prove the access model in Jakarta. 2027: scale access to Surabaya and Bandung only if the Q3 data says go, and use PROVE results to lock in protocols. 2028: Suprane as a premium niche agent for defined patient groups, with low-flow as standard. If sustainability policy in Indonesia moves faster than expected, we manage it for profit and move investment to the nutrition portfolio.", "trap": "A three-year plan that only goes up."}, {"id": "G6", "round": "G. Portfolio and Baxter strategy", "lens": "Finance", "level": "Stretch", "q": "Why not let Suprane decline and move the $50k to C?", "testing": "Invest vs harvest logic.", "approach": ["Compare marginal return.", "$50k in a price war for C buys little; in Suprane it protects $0.9M.", "Agree you'd harvest if the gate fails."], "answer": "Because the marginal dollar works harder in Suprane right now. 50 thousand in C's price war buys very little, since C is already at 67%. In Suprane it protects 900 thousand and funds a test of whether access is the real barrier. If the Q3 gate fails, I'd come back and recommend exactly what you're suggesting.", "trap": "Being emotionally attached to your chosen product."}, {"id": "H1", "round": "H. Leadership and stakeholders", "lens": "Hiring manager", "level": "Must nail", "q": "What would you do in your first 90 days?", "testing": "Structured onboarding, listening before acting.", "approach": ["30: listen and learn data. 60: diagnose and align. 90: commit and launch.", "Name who you'd meet.", "Say what you'd deliver at day 90."], "answer": "First 30 days: listen. Ride with reps, meet the top 10 anesthesiologists and procurement heads, sit with medical, supply and the distributor, and rebuild the numbers from sell-out. Days 30 to 60: test my case hypotheses against reality and agree the target account list with sales. By day 90: a brand plan with a budget your team signed off on, and the first quick win, such as the inactive-user reactivation.", "trap": "Promising to change everything in month one."}, {"id": "H2", "round": "H. Leadership and stakeholders", "lens": "Commercial head", "level": "Must nail", "q": "The sales director disagrees with your segmentation and wants broad coverage. What do you do?", "testing": "Influence and conflict handling.", "approach": ["Understand their reason first. They may know something.", "Use data and a small test, not authority.", "Agree on a decision rule."], "answer": "First I'd ask why. Sales often sees things I can't, like a key relationship in a low-potential account. If we still disagree, I'd propose a test: 3 months of focused coverage in a few territories against broad coverage in others, and compare bottles per rep hour. Then we let the data decide, and I'd say so up front so neither of us is defending ego.", "trap": "Escalating to the boss first."}, {"id": "H3", "round": "H. Leadership and stakeholders", "lens": "HR / hiring manager", "level": "Must nail", "q": "Tell me about a time you turned around a declining product or business.", "testing": "Evidence you've done this before.", "approach": ["STAR. One story, with numbers.", "Situation in 1 line, Task in 1 line, Action is most of the answer, Result with a number.", "End with what you'd do differently."], "answer": "[Use your own story. See 05-leadership-and-behavioral.md for the template.]", "trap": "Saying 'we' for everything so your role is invisible."}, {"id": "H4", "round": "H. Leadership and stakeholders", "lens": "HR", "level": "Must nail", "q": "Tell me about a time a plan of yours failed.", "testing": "Self-awareness and learning.", "approach": ["A real failure, not a disguised strength.", "Own your part.", "What changed in how you work now."], "answer": "[Use your own story. See 05-leadership-and-behavioral.md.]", "trap": "A fake failure like 'I worked too hard'."}, {"id": "H5", "round": "H. Leadership and stakeholders", "lens": "Hiring manager", "level": "Likely", "q": "How do you develop people, given this is a path to a managerial role?", "testing": "People leadership readiness.", "approach": ["Concrete habits.", "An example of someone you grew."], "answer": "Three habits: give each person one stretch project they own end to end, give feedback within a day rather than at review time, and let them present their own work to leadership. [Add one name-free example of someone you coached and what they achieved.]", "trap": "Abstract management theory."}, {"id": "H6", "round": "H. Leadership and stakeholders", "lens": "HR", "level": "Must nail", "q": "Why Baxter, why this role, why now?", "testing": "Motivation and fit.", "approach": ["Why Baxter: something specific to Baxter.", "Why this role: hospital portfolio across anesthesia, nutrition, vitamins.", "Why now: your career step."], "answer": "[Personalise. Hook: Baxter's products are in the OR and ICU at the moments patients are most fragile. The role covers anesthesia and nutrition, which is a portfolio job, not a single-brand job. And it's the right time for me to own a P&L-style plan, which is what this case let me practise.]", "trap": "Talking about salary, title, or 'big company'."}, {"id": "H7", "round": "H. Leadership and stakeholders", "lens": "HR", "level": "Likely", "q": "What's your biggest weakness?", "testing": "Self-awareness with evidence of fixing it.", "approach": ["A real one that's relevant but not fatal.", "What you do about it now.", "Optional: point to this case as an example."], "answer": "I can get so deep into the strategy that I check the numbers last. If you spotted my 45 versus 50 thousand, that's an example. My fix is a final pass where I rebuild every number from scratch before I share anything, and I'll be doing that more strictly from now on.", "trap": "'I'm a perfectionist.'"}];
const KEY = "baxter-pm-drill-v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { marks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch(e) {} };
const $ = id => document.getElementById(id);
const rounds = [...new Set(QS.map(q => q.round))];
rounds.forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = r; $("round").appendChild(o); });

let deck = [], idx = 0, t = 120, running = false, tick = null;

function build(){
  const r = $("round").value, l = $("level").value, m = $("mode").value;
  deck = QS.filter(q => (!r || q.round === r) && (!l || q.level === l) && (m !== "shaky" || marks[q.id] === "shaky"));
  if (m !== "order") for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  idx = 0; render();
}
function resetTimer(){ clearInterval(tick); running = false; t = 120; $("tbtn").textContent = "Start"; paint(); }
function paint(){
  const s = Math.abs(t), mm = Math.floor(s / 60), ss = String(s % 60).padStart(2, "0");
  $("time").textContent = (t < 0 ? "+" : "") + mm + ":" + ss;
  $("time").classList.toggle("over", t < 0);
  $("prog").style.width = Math.min(100, (120 - Math.max(t, 0)) / 120 * 100) + "%";
}
function toggleTimer(){
  if (running) { clearInterval(tick); running = false; $("tbtn").textContent = "Resume"; return; }
  running = true; $("tbtn").textContent = "Pause";
  tick = setInterval(() => { t--; paint(); }, 1000);
}
function el(tag, text, cls){ const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; }
function render(){
  resetTimer(); $("rev").classList.add("hidden");
  const meta = $("meta"); meta.replaceChildren();
  if (!deck.length) {
    $("q").textContent = $("mode").value === "shaky" ? "No shaky questions yet. Nice." : "No questions match these filters.";
    $("stats").textContent = ""; return;
  }
  const q = deck[idx];
  meta.append(el("span", q.id, "chip"), el("span", q.round, "chip"), el("span", q.lens, "chip"),
    el("span", q.level, "chip " + (q.level === "Must nail" ? "must" : q.level === "Likely" ? "likely" : "")));
  if (marks[q.id]) meta.append(el("span", marks[q.id] === "good" ? "Nailed before" : "Shaky before", "chip"));
  $("q").textContent = q.q;
  $("testing").textContent = q.testing;
  const ul = $("approach"); ul.replaceChildren(...q.approach.map(a => el("li", a)));
  $("answer").textContent = q.answer;
  $("trap").textContent = q.trap;
  const good = Object.values(marks).filter(v => v === "good").length, shaky = Object.values(marks).filter(v => v === "shaky").length;
  $("stats").textContent = `Question ${idx + 1} of ${deck.length} · Nailed ${good} · Shaky ${shaky} · ${QS.length} total`;
}
function reveal(){ if (deck.length) { $("rev").classList.remove("hidden"); if (running) toggleTimer(); } }
function next(){ if (!deck.length) return; idx = (idx + 1) % deck.length; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function mark(v){ if (!deck.length) return; marks[deck[idx].id] = v; save(); next(); }

$("tbtn").onclick = toggleTimer; $("show").onclick = reveal; $("next").onclick = next;
$("good").onclick = () => mark("good"); $("shaky").onclick = () => mark("shaky");
$("restart").onclick = build; ["round","level","mode"].forEach(id => $(id).onchange = build);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); toggleTimer(); }
  else if (e.key === "r" || e.key === "R") reveal();
  else if (e.key === "n" || e.key === "N") next();
  else if (e.key === "1" && !$("rev").classList.contains("hidden")) mark("good");
  else if (e.key === "2" && !$("rev").classList.contains("hidden")) mark("shaky");
});
build();
</script>
